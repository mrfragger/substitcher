<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>SubStitcher LUTs Gallery</title>
<style>
body {
background-color: #212121;
color: #f1f1f1;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
margin: 0;
padding: 10px;
}
.container {
max-width: 800px;
margin: 0 auto;
padding: 10px;
}
h1 {
text-align: center;
color: #f1f1f1;
margin-bottom: 10px;
}
.gallery-links {
display: grid;
gap: 8px;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
}
.gallery-link {
background: rgba(68, 68, 68, 0.3);
border: 1px solid rgba(255, 255, 255, 0.1);
border-radius: 8px;
padding: 20px;
text-decoration: none;
color: #f1f1f1;
transition: all 0.3s ease;
display: block;
}
.gallery-link:hover {
background: rgba(68, 68, 68, 0.5);
transform: translateY(-2px);
box-shadow: 0 4px 4px rgba(0, 0, 0, 0.3);
}
.gallery-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 2px;
}
.gallery-title {
font-size: 18px;
font-weight: bold;
text-transform: capitalize;
}
.gallery-count {
font-size: 14px;
color: #999999;
background: rgba(0, 0, 0, 0.3);
padding: 4px 8px;
border-radius: 4px;
}
</style>
</head>
<body>
<div class="container">
<div class="gallery-links">
 <a href="lutgallery/index.html" class="gallery-link">
   <div class="gallery-header">
     <div class="gallery-title">SubStitcher LUTs Gallery</div>
     <div class="gallery-count">     560 images</div>
   </div>
 </a>
</div>
<img src="lutgallery/original.avif" width="800" height="533">

</div>
</body>
</html>
