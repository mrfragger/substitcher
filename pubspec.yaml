name: substitcher
description: opus chaptered audiobook player and encoder with colored vtt subtitles and fancy fonts, Quran vtt translations, video and audio editor
publish_to: "none"
version: 26.11.09

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # File system
  file_picker: ^13.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  crypto: ^3.0.8
  scrollable_positioned_list: ^0.3.8

  # internet
  http: ^1.2.0
  url_launcher: ^6.3.2

  # Process execution (FFmpeg calls)
  process_run: ^1.4.1

  # State management
  flutter_riverpod: ^3.5.0
  wakelock_plus: ^1.8.2

  # Audio player
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_linux: ^1.1.4
  media_kit_libs_windows_video: ^1.0.9

  # UI
  cupertino_icons: ^2.0.0
  shared_preferences: ^2.5.6
  window_manager: ^0.6.0
  package_info_plus: ^10.2.2

  # Character handling for CJK, Thai, Khmer tokenization
  characters: ^1.4.0
  tiny_segmenter_dart: ^1.0.0
  dart_jieba: ^1.0.1
  word_thai_split: ^1.0.2
  betto_icu: ^0.1.0
  intl: ^0.20.2

  # anki apkg files
  archive: ^4.6.0
  csv: ^8.0.0
  sqlite3: ^3.9.0
  html: ^0.15.6

  # images decoding / encoding
  image: ^4.12.0
  avif_native: ^0.2.0

  # clipboard images
  pasteboard: ^0.6.0

hooks:
  user_defines:
    avif_native:
      features: full   # decode + encode
      decoder: dav1d
      encoder: aom

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  macos:
    generate: true
    image_path: "assets/icon.png"

  linux:
    generate: true
    image_path: "assets/icon.png"

  windows:
    generate: true
    image_path: "assets/icon.png"

flutter:
  uses-material-design: true

  fonts:
    - family: CustomFonts
      fonts:
        - asset: assets/fonts/0xProto.otf
    - family: ScheherazadeNew
      fonts:
        - asset: assets/fonts/ScheherazadeNew-Regular.woff2
    - family : Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf

