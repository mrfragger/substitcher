			shellScript = "# Copy FFmpeg binaries to app bundle\nRESOURCES_BIN=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/bin\"\nmkdir -p \"$RESOURCES_BIN\"\n\nif [ -f \"${SRCROOT}/Runner/Resources/bin/ffmpeg\" ]; then\n    cp \"${SRCROOT}/Runner/Resources/bin/ffmpeg\" \"$RESOURCES_BIN/\"\n    cp \"${SRCROOT}/Runner/Resources/bin/ffprobe\" \"$RESOURCES_BIN/\"\n    chmod +x \"$RESOURCES_BIN/ffmpeg\"\n    chmod +x \"$RESOURCES_BIN/ffprobe\"\n    xattr -cr \"$RESOURCES_BIN/\"\n    echo \"Copied FFmpeg binaries to $RESOURCES_BIN and removed quarantine flags\"\nelse\n    echo \"Warning: FFmpeg binaries not found in ${SRCROOT}/Runner/Resources/bin/\"\nfi\n\n# Copy Whisper binaries and libraries to app bundle\nRESOURCES_WHISPER=\"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/whisper\"\nmkdir -p \"$RESOURCES_WHISPER\"\n\nif [ -d \"${SRCROOT}/Runner/Resources/whisper\" ]; then\n    cp \"${SRCROOT}/Runner/Resources/whisper/\"* \"$RESOURCES_WHISPER/\"\n    chmod +x \"$RESOURCES_WHISPER/whisper-cli\"\n    xattr -cr \"$RESOURCES_WHISPER/\"\n    \n    # Fix dylib paths for whisper-cli (replace @rpath with @executable_path)\n    echo \"Fixing whisper-cli library paths...\"\n    \n    # Check if universal binary and fix both architectures\n    if lipo -info \"$RESOURCES_WHISPER/whisper-cli\" 2>/dev/null | grep -q \"x86_64 arm64\"; then\n        # Extract, fix, recombine universal binary\n        lipo \"$RESOURCES_WHISPER/whisper-cli\" -thin x86_64 -output \"$RESOURCES_WHISPER/whisper-cli-x86\"\n        lipo \"$RESOURCES_WHISPER/whisper-cli\" -thin arm64 -output \"$RESOURCES_WHISPER/whisper-cli-arm\"\n        \n        for arch in \"$RESOURCES_WHISPER/whisper-cli-x86\" \"$RESOURCES_WHISPER/whisper-cli-arm\"; do\n            install_name_tool -change @rpath/libwhisper.1.dylib @executable_path/libwhisper.1.dylib \"$arch\"\n            install_name_tool -change @rpath/libggml.dylib @executable_path/libggml.dylib \"$arch\"\n            install_name_tool -change @rpath/libggml-base.dylib @executable_path/libggml-base.dylib \"$arch\"\n            install_name_tool -change @rpath/libggml-cpu.dylib @executable_path/libggml-cpu.dylib \"$arch\"\n            install_name_tool -change @rpath/libggml-blas.dylib @executable_path/libggml-blas.dylib \"$arch\"\n            install_name_tool -change @rpath/libggml-metal.dylib @executable_path/libggml-metal.dylib \"$arch\"\n        done\n        \n        lipo -create \"$RESOURCES_WHISPER/whisper-cli-x86\" \"$RESOURCES_WHISPER/whisper-cli-arm\" -output \"$RESOURCES_WHISPER/whisper-cli\"\n        rm \"$RESOURCES_WHISPER/whisper-cli-x86\" \"$RESOURCES_WHISPER/whisper-cli-arm\"\n    else\n        # Single architecture\n        install_name_tool -change @rpath/libwhisper.1.dylib @executable_path/libwhisper.1.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n        install_name_tool -change @rpath/libggml.dylib @executable_path/libggml.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n        install_name_tool -change @rpath/libggml-base.dylib @executable_path/libggml-base.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n        install_name_tool -change @rpath/libggml-cpu.dylib @executable_path/libggml-cpu.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n        install_name_tool -change @rpath/libggml-blas.dylib @executable_path/libggml-blas.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n        install_name_tool -change @rpath/libggml-metal.dylib @executable_path/libggml-metal.dylib \"$RESOURCES_WHISPER/whisper-cli\"\n    fi\n    \n    # Fix dylib internal references\n    for lib in \"$RESOURCES_WHISPER\"/*.dylib; do\n        if [ -f \"$lib\" ] && [ ! -L \"$lib\" ]; then\n            install_name_tool -change @rpath/libggml.dylib @loader_path/libggml.dylib \"$lib\" 2>/dev/null || true\n            install_name_tool -change @rpath/libggml-base.dylib @loader_path/libggml-base.dylib \"$lib\" 2>/dev/null || true\n            install_name_tool -change @rpath/libggml-cpu.dylib @loader_path/libggml-cpu.dylib \"$lib\" 2>/dev/null || true\n            install_name_tool -change @rpath/libggml-blas.dylib @loader_path/libggml-blas.dylib \"$lib\" 2>/dev/null || true\n            install_name_tool -change @rpath/libggml-metal.dylib @loader_path/libggml-metal.dylib \"$lib\" 2>/dev/null || true\n            install_name_tool -change @rpath/libwhisper.1.dylib @loader_path/libwhisper.1.dylib \"$lib\" 2>/dev/null || true\n        fi\n    done\n    \n    echo \"Whisper library paths fixed\"\n    \n    # Verify\n    echo \"=== Verifying no @rpath remains ===\"\n    otool -L \"$RESOURCES_WHISPER/whisper-cli\" | grep @rpath && echo \"WARNING: @rpath still present!\" || echo \"whisper-cli: OK\"\n    \n    echo \"Copied Whisper binaries to $RESOURCES_WHISPER\"\nelse\n    echo \"Warning: Whisper binaries not found in ${SRCROOT}/Runner/Resources/whisper/\"\nfi\n\n# Re-sign the app after modifying binaries\ncodesign --force --deep --sign - \"${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app\"\necho \"Re-signed app\"\n";
		};
