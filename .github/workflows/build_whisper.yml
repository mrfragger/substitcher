name: Build Whisper Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_whisper.yml"

jobs:
  build-whisper-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Clone and build whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          strip bin/whisper-cli

      - name: Collect all libraries
        run: |
          mkdir -p whisper-binaries/linux
          cp whisper.cpp/build/bin/whisper-cli whisper-binaries/linux/
          find whisper.cpp/build/src -name "libwhisper*.so*" -exec cp {} whisper-binaries/linux/ \;
          find whisper.cpp/build -name "libggml*.so*" -exec cp {} whisper-binaries/linux/ \;
          chmod +x whisper-binaries/linux/whisper-cli
          echo "=== Final contents ==="
          ls -lh whisper-binaries/linux/

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux
          path: whisper-binaries/linux/
          retention-days: 90

  build-whisper-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1

      - name: Build arm64 (with Metal)
        run: |
          cd whisper.cpp
          mkdir build-arm64 && cd build-arm64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON \
            -DWHISPER_METAL=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DBUILD_SHARED_LIBS=ON
          cmake --build . --config Release -j 4
          strip bin/whisper-cli

      - name: Fix library paths for bundling
        run: |
          cd whisper.cpp/build-arm64/bin

          echo "=== Original library dependencies ==="
          otool -L whisper-cli

          # Give every dylib a loader-relative ID (they all live together in bin/)
          for lib in *.dylib; do
            install_name_tool -id "@executable_path/$lib" "$lib"
          done

          # Rewrite every @rpath reference, in the exe and in each dylib, to @executable_path
          for target in whisper-cli *.dylib; do
            for dep in $(otool -L "$target" | awk '/@rpath\//{print $1}'); do
              libname=$(basename "$dep")
              install_name_tool -change "$dep" "@executable_path/$libname" "$target"
            done
          done

          echo "=== Fixed library dependencies ==="
          otool -L whisper-cli
          echo "=== Checking for remaining @rpath ==="
          otool -L whisper-cli | grep @rpath && echo "WARNING: @rpath still present!" || echo "All @rpath removed!"

      - name: Collect all libraries
        run: |
          cd whisper.cpp/build-arm64/bin
          mkdir -p ../../../whisper-binaries/macos
          cp whisper-cli *.dylib ../../../whisper-binaries/macos/

          cd ../../../whisper-binaries/macos
          chmod +x whisper-cli *.dylib

          echo "=== Final contents ==="
          ls -lh
          echo "=== Architecture verification ==="
          file whisper-cli
          file *.dylib
          echo "=== Library dependencies ==="
          otool -L whisper-cli

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-arm64
          path: whisper-binaries/macos/
          retention-days: 90

  build-whisper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1

      - name: Configure
        run: |
          cd whisper.cpp
          cmake -S . -B ./build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: |
          cd whisper.cpp/build
          msbuild ALL_BUILD.vcxproj -t:build -p:configuration=Release -p:platform=x64

      - name: Collect all libraries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path whisper-binaries/windows
          Copy-Item whisper.cpp/build/bin/Release/whisper-cli.exe whisper-binaries/windows/
          Copy-Item whisper.cpp/build/bin/Release/*.dll whisper-binaries/windows/
          Write-Host "=== Final contents ==="
          Get-ChildItem whisper-binaries/windows/ | Format-Table Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows
          path: whisper-binaries/windows/
          retention-days: 90
