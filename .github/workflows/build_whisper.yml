name: Build Whisper Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build_whisper.yml"

jobs:
  build-whisper-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Clone and build whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          strip bin/whisper-cli

      - name: Collect all libraries
        run: |
          mkdir -p whisper-binaries/linux
          cp whisper.cpp/build/bin/whisper-cli whisper-binaries/linux/
          find whisper.cpp/build/src -name "libwhisper*.so*" -exec cp {} whisper-binaries/linux/ \;
          find whisper.cpp/build -name "libggml*.so*" -exec cp {} whisper-binaries/linux/ \;
          chmod +x whisper-binaries/linux/whisper-cli
          echo "=== Final contents ==="
          ls -lh whisper-binaries/linux/

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-linux
          path: whisper-binaries/linux/

  build-whisper-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1

      - name: Build arm64 (with Metal)
        run: |
          cd whisper.cpp
          mkdir build-arm64 && cd build-arm64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DGGML_METAL=ON \
            -DWHISPER_METAL=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build . --config Release -j 4
          strip bin/whisper-cli

      - name: Fix library paths for bundling
        run: |
          cd whisper.cpp/build-arm64

          echo "=== Original library dependencies ==="
          otool -L bin/whisper-cli

          install_name_tool -change @rpath/libwhisper.1.dylib @executable_path/libwhisper.1.dylib bin/whisper-cli
          install_name_tool -change @rpath/libwhisper.dylib @executable_path/libwhisper.dylib bin/whisper-cli
          install_name_tool -change @rpath/libggml.dylib @executable_path/libggml.dylib bin/whisper-cli
          install_name_tool -change @rpath/libggml-base.dylib @executable_path/libggml-base.dylib bin/whisper-cli
          install_name_tool -change @rpath/libggml-cpu.dylib @executable_path/libggml-cpu.dylib bin/whisper-cli
          install_name_tool -change @rpath/libggml-metal.dylib @executable_path/libggml-metal.dylib bin/whisper-cli
          install_name_tool -change @rpath/libggml-blas.dylib @executable_path/libggml-blas.dylib bin/whisper-cli

          cd src
          for lib in libwhisper*.dylib; do
            if [ -f "$lib" ] && [ ! -L "$lib" ]; then
              echo "Fixing $lib"
              install_name_tool -id @loader_path/$lib "$lib"
              install_name_tool -change @rpath/libggml.dylib @loader_path/libggml.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-base.dylib @loader_path/libggml-base.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-cpu.dylib @loader_path/libggml-cpu.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-metal.dylib @loader_path/libggml-metal.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-blas.dylib @loader_path/libggml-blas.dylib "$lib" 2>/dev/null || true
            fi
          done

          cd ../ggml/src
          for lib in *.dylib; do
            if [ -f "$lib" ] && [ ! -L "$lib" ]; then
              echo "Fixing ggml lib: $lib"
              install_name_tool -id @loader_path/$lib "$lib"
              install_name_tool -change @rpath/libggml.dylib @loader_path/libggml.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-base.dylib @loader_path/libggml-base.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-cpu.dylib @loader_path/libggml-cpu.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-metal.dylib @loader_path/libggml-metal.dylib "$lib" 2>/dev/null || true
              install_name_tool -change @rpath/libggml-blas.dylib @loader_path/libggml-blas.dylib "$lib" 2>/dev/null || true
            fi
          done

          cd ../../bin

          echo "=== Fixed library dependencies ==="
          otool -L whisper-cli
          echo "=== Checking for remaining @rpath ==="
          otool -L whisper-cli | grep @rpath && echo "WARNING: @rpath still present!" || echo "All @rpath removed!"

      - name: Collect all libraries
        run: |
          cd whisper.cpp/build-arm64
          mkdir -p ../../whisper-binaries/macos

          cp bin/whisper-cli ../../whisper-binaries/macos/
          cp src/libwhisper*.dylib ../../whisper-binaries/macos/ || true
          find ggml -name "*.dylib" -type f -exec cp {} ../../whisper-binaries/macos/ \;

          cd ../../whisper-binaries/macos
          chmod +x whisper-cli *.dylib

          echo "=== Final contents ==="
          ls -lh
          echo "=== Architecture verification ==="
          file whisper-cli
          file *.dylib
          echo "=== Library dependencies ==="
          otool -L whisper-cli

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-macos-arm64
          path: whisper-binaries/macos/

  build-whisper-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1

      - name: Configure
        run: |
          cd whisper.cpp
          cmake -S . -B ./build -A x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON

      - name: Build
        run: |
          cd whisper.cpp/build
          msbuild ALL_BUILD.vcxproj -t:build -p:configuration=Release -p:platform=x64

      - name: Collect all libraries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path whisper-binaries/windows
          Copy-Item whisper.cpp/build/bin/Release/whisper-cli.exe whisper-binaries/windows/
          Copy-Item whisper.cpp/build/bin/Release/*.dll whisper-binaries/windows/
          Write-Host "=== Final contents ==="
          Get-ChildItem whisper-binaries/windows/ | Format-Table Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows
          path: whisper-binaries/windows/

  build-whisper-windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.27
        with:
          cuda: "12.4.0"
          method: "network"

      - name: Clone whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          git checkout v1.9.1

      - name: Configure with CUDA
        run: |
          cd whisper.cpp
          cmake -S . -B ./build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DGGML_CUDA=ON

      - name: Build
        run: |
          cd whisper.cpp/build
          msbuild ALL_BUILD.vcxproj -t:build -p:configuration=Release -p:platform=x64

      - name: Collect all libraries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path whisper-binaries/windows-cuda
          Copy-Item whisper.cpp/build/bin/Release/whisper-cli.exe whisper-binaries/windows-cuda/
          Copy-Item whisper.cpp/build/bin/Release/*.dll whisper-binaries/windows-cuda/
          Write-Host "=== Final contents ==="
          Get-ChildItem whisper-binaries/windows-cuda/ | Format-Table Name, Length

      - name: Upload Windows CUDA binary
        uses: actions/upload-artifact@v4
        with:
          name: whisper-windows-cuda
          path: whisper-binaries/windows-cuda/

  combine-artifacts:
    needs:
      [
        build-whisper-linux,
        build-whisper-macos,
        build-whisper-windows,
        build-whisper-windows-cuda,
      ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine all binaries
        run: |
          mkdir -p combined/linux
          mkdir -p combined/macos
          mkdir -p combined/windows
          mkdir -p combined/windows-cuda

          cp artifacts/whisper-linux/* combined/linux/ 2>/dev/null || true
          cp artifacts/whisper-macos/* combined/macos/ 2>/dev/null || true
          cp artifacts/whisper-windows/* combined/windows/ 2>/dev/null || true
          cp artifacts/whisper-windows-cuda/* combined/windows-cuda/ 2>/dev/null || true

          echo "=== Binary sizes ==="
          find combined -type f -exec ls -lh {} \;

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whisper-all-platforms
          path: combined/
          retention-days: 90

      - name: Create release with binaries
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: combined/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
