  create-release:
    needs: [build-macos, build-linux-appimage, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos-build/SubStitcher-macOS-arm64.dmg
            linux-appimage-build/substitcher-*.AppImage
            windows-build/SubStitcher-Windows-x64.zip
            # android-build/substitcher-android-universal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}