name: Build llama-server Binaries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build_llamacpp.yml'

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin ff52ee964
          git checkout FETCH_HEAD

      - name: Build arm64 with Metal
        run: |
          cd llama.cpp
          mkdir build-arm64 && cd build-arm64
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build . --config Release --target llama-server -j 4
          strip bin/llama-server

      - name: Fix library paths
        run: |
          cd llama.cpp/build-arm64/bin
          install_name_tool -add_rpath @executable_path llama-server 2>/dev/null || true
          otool -L llama-server

      - name: Collect binaries
        run: |
          mkdir -p llama-binaries/macos
          cp llama.cpp/build-arm64/bin/llama-server llama-binaries/macos/llama-server
          find llama.cpp/build-arm64 -name "ggml-metal.metal" -exec cp {} llama-binaries/macos/ \; 2>/dev/null || true
          find llama.cpp/build-arm64 -name "default.metallib" -exec cp {} llama-binaries/macos/ \; 2>/dev/null || true
          chmod +x llama-binaries/macos/llama-server
          ls -lh llama-binaries/macos/
          file llama-binaries/macos/llama-server

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-macos-arm64
          path: llama-binaries/macos/
          retention-days: 90

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Clone llama.cpp
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin ff52ee964
          git checkout FETCH_HEAD

      - name: Build
        run: |
          cd llama.cpp
          mkdir build && cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON
          cmake --build . --config Release --target llama-server -j 4
          strip bin/llama-server

      - name: Collect binaries
        run: |
          mkdir -p llama-binaries/linux
          cp llama.cpp/build/bin/llama-server llama-binaries/linux/llama-server
          chmod +x llama-binaries/linux/llama-server
          ls -lh llama-binaries/linux/
          ldd llama-binaries/linux/llama-server

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-linux-x64
          path: llama-binaries/linux/
          retention-days: 90

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Clone llama.cpp
        run: |
          git init llama.cpp
          cd llama.cpp
          git remote add origin https://github.com/ggml-org/llama.cpp.git
          git fetch --depth 1 origin ff52ee964
          git checkout FETCH_HEAD

      - name: Configure
        run: |
          cd llama.cpp
          cmake -S . -B ./build -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLAMA_BUILD_TESTS=OFF `
            -DLLAMA_BUILD_EXAMPLES=ON `
            -DLLAMA_BUILD_SERVER=ON

      - name: Build
        run: |
          cd llama.cpp/build
          cmake --build . --config Release --target llama-server -j 4

      - name: Collect binaries
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path llama-binaries/windows
          Copy-Item llama.cpp/build/bin/Release/llama-server.exe llama-binaries/windows/llama-server.exe
          Get-ChildItem llama.cpp/build/bin/Release/*.dll -ErrorAction SilentlyContinue |
            Copy-Item -Destination llama-binaries/windows/
          Get-ChildItem llama-binaries/windows/ | Format-Table Name, Length

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: llama-windows-x64
          path: llama-binaries/windows/
          retention-days: 90

  combine:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Combine
        run: |
          mkdir -p combined/macos combined/linux combined/windows
          cp artifacts/llama-macos-arm64/* combined/macos/ 2>/dev/null || true
          cp artifacts/llama-linux-x64/*   combined/linux/ 2>/dev/null || true
          cp artifacts/llama-windows-x64/* combined/windows/ 2>/dev/null || true
          find combined -type f -exec ls -lh {} \;

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: llama-all-platforms
          path: combined/
          retention-days: 90