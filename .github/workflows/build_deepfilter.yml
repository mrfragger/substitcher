name: Build DeepFilter

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Download DeepFilter binary and model
        run: |
          curl -L https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-unknown-linux-musl \
            -o deep-filter
          chmod +x deep-filter
          curl -L https://github.com/Rikorose/DeepFilterNet/raw/main/models/DeepFilterNet3_onnx.tar.gz \
            -o DeepFilterNet3.tar.gz
          ls -lh deep-filter DeepFilterNet3.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: deepfilter-linux-x64
          path: |
            deep-filter
            DeepFilterNet3.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Download DeepFilter binary and model
        run: |
          curl -L https://github.com/Rikorose/DeepFilterNet/releases/download/v0.5.6/deep-filter-0.5.6-x86_64-pc-windows-msvc.exe `
            -o deep-filter.exe
          curl -L https://github.com/Rikorose/DeepFilterNet/raw/main/models/DeepFilterNet3_onnx.tar.gz `
            -o DeepFilterNet3.tar.gz
          dir deep-filter.exe
          dir DeepFilterNet3.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: deepfilter-windows-x64
          path: |
            deep-filter.exe
            DeepFilterNet3.tar.gz